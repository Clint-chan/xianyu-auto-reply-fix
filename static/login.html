<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 自动回复管理系统</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand-mark.svg">
  <link rel="stylesheet" href="/static/lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/lib/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page auth-page--login">
  <main class="auth-shell auth-shell--single">
    <section class="login-container auth-card">
      <div class="login-header auth-card-header auth-card-header--minimal">
        <a class="auth-card-brand auth-card-brand--compact auth-brand-link" href="/login.html">
          <img src="/static/brand-mark.svg" alt="自动回复管理系统标识">
          <div>
            <p class="auth-card-eyebrow">自动回复管理系统</p>
            <h1>账号登录</h1>
            <p>使用账号和密码进入管理后台。</p>
          </div>
        </a>
      </div>

      <div class="login-body">
        <form id="loginForm" novalidate>
          <label class="auth-field-label" for="username">
            <i class="bi bi-person-circle"></i>账号
          </label>
          <div class="input-group auth-input">
            <i class="bi bi-person-fill"></i>
            <input type="text" class="form-control" id="username" placeholder="请输入账号" autocomplete="username" required>
          </div>

          <label class="auth-field-label" for="password">
            <i class="bi bi-key"></i>密码
          </label>
          <div class="input-group auth-input">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control" id="password" placeholder="请输入密码" autocomplete="current-password" required>
          </div>

          <div id="securityCaptchaSection" class="mb-3" hidden>
            <label class="form-label" for="securityCaptchaCode">
              <i class="bi bi-shield-check me-1"></i>安全验证
            </label>
            <div class="row g-2">
              <div class="col-7">
                <input type="text" class="form-control" id="securityCaptchaCode" placeholder="输入验证码" maxlength="4" autocomplete="off" inputmode="latin">
              </div>
              <div class="col-5">
                <div class="captcha-container captcha-frame">
                  <img id="securityCaptchaImage" class="captcha-image" src="" alt="安全验证码" onclick="refreshSecurityCaptcha()" title="点击刷新验证码">
                  <div id="securityCaptchaLoading" class="captcha-loading">
                    <div class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="form-text text-muted">
              <i class="bi bi-info-circle me-1"></i>请输入图中验证码，点击图片可刷新
            </div>
          </div>

          <div id="errorAlert" class="alert alert-danger d-none" role="alert" aria-live="polite">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="errorMessage"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-login w-100">
            <span class="loading spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            <span id="loginText">登录</span>
          </button>
        </form>

        <div id="registerSection" class="text-center mt-3">
          <span class="text-muted">还没有账号？</span>
          <a href="/register.html" class="text-decoration-none">
            <i class="bi bi-person-plus me-1"></i>立即注册
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const loading = loginForm.querySelector('.loading');
    const loginText = document.getElementById('loginText');
    const submitButton = loginForm.querySelector('button[type="submit"]');

    let securityCaptchaId = null;
    let loginCaptchaEnabled = true;

    function showError(message) {
      errorMessage.textContent = message;
      errorAlert.classList.remove('d-none');
    }

    function hideError() {
      errorAlert.classList.add('d-none');
    }

    function setLoading(isLoading) {
      loading.classList.toggle('show', isLoading);
      loginText.textContent = isLoading ? '登录中...' : '登录';
      submitButton.disabled = isLoading;
    }

    async function verifyExistingToken() {
      const token = localStorage.getItem('auth_token');
      if (!token) {
        return;
      }

      try {
        const response = await fetch('/verify', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const result = await response.json();

        if (result.authenticated) {
          window.location.href = '/admin';
        } else {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user_info');
        }
      } catch (error) {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('user_info');
      }
    }

    async function checkRegistrationStatus() {
      try {
        const response = await fetch('/registration-status');
        if (!response.ok) {
          return;
        }

        const data = await response.json();
        const registerSection = document.getElementById('registerSection');
        if (registerSection) {
          registerSection.style.display = data.enabled ? 'block' : 'none';
        }
      } catch (error) {
        console.error('检查注册状态失败:', error);
      }
    }

    async function checkLoginCaptchaEnabled() {
      try {
        const response = await fetch('/api/login-captcha-enabled');
        const result = await response.json();
        loginCaptchaEnabled = result.enabled !== false;
      } catch (error) {
        console.error('检查登录验证码状态失败:', error);
        loginCaptchaEnabled = true;
      }

      const securityCaptchaSection = document.getElementById('securityCaptchaSection');
      if (securityCaptchaSection) {
        securityCaptchaSection.hidden = !loginCaptchaEnabled;
      }

      if (loginCaptchaEnabled) {
        await loadSecurityCaptcha();
      }
    }

    async function loadSecurityCaptcha() {
      if (!loginCaptchaEnabled) {
        return;
      }

      const captchaImage = document.getElementById('securityCaptchaImage');
      const captchaLoading = document.getElementById('securityCaptchaLoading');

      captchaLoading.style.display = 'block';
      captchaImage.style.opacity = '0.4';

      try {
        const response = await fetch('/captcha/generate');
        securityCaptchaId = response.headers.get('X-Captcha-Id');

        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);
        captchaImage.src = imageUrl;
        document.getElementById('securityCaptchaCode').value = '';
      } catch (error) {
        console.error('加载安全验证码失败:', error);
      } finally {
        captchaLoading.style.display = 'none';
        captchaImage.style.opacity = '1';
      }
    }

    function refreshSecurityCaptcha() {
      loadSecurityCaptcha();
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideError();
      setLoading(true);

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        if (!username || !password) {
          showError('请输入账号和密码');
          return;
        }

        const loginData = { username, password };

        if (loginCaptchaEnabled) {
          const captchaCode = document.getElementById('securityCaptchaCode').value.trim();
          if (!captchaCode) {
            showError('请输入验证码');
            return;
          }

          loginData.captcha_id = securityCaptchaId;
          loginData.captcha_code = captchaCode;
        }

        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(loginData)
        });

        const result = await response.json();

        if (result.success) {
          localStorage.setItem('auth_token', result.token);
          localStorage.setItem('user_info', JSON.stringify({
            user_id: result.user_id,
            username: result.username,
            is_admin: result.is_admin
          }));

          const redirectUrl = localStorage.getItem('redirectAfterLogin');
          if (redirectUrl) {
            localStorage.removeItem('redirectAfterLogin');
            window.location.href = redirectUrl;
          } else {
            window.location.href = '/admin';
          }
          return;
        }

        showError(result.message || '登录失败，请重试');
        if (loginCaptchaEnabled) {
          refreshSecurityCaptcha();
        }
      } catch (error) {
        showError('登录失败，请检查网络连接');
        if (loginCaptchaEnabled) {
          refreshSecurityCaptcha();
        }
      } finally {
        setLoading(false);
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      verifyExistingToken();
      checkRegistrationStatus();
      await checkLoginCaptchaEnabled();
    });
  </script>
</body>
</html>
